  const hostStyle = hostStyles.sheet.cssRules[0].style;
  // Typography, geometry and interaction cursors still follow the host.
  const styleForProperty = (property) =&gt;
    /^--(?:font-|radius|corner-shape$|cursor-interaction$|icon-size$|visualize-paint-gutter$)/.test(property)
      ? document.documentElement.style
      : hostStyle;
  const initialGlobals =
    globalThis.__codexVisualizationInitialGlobals ?? globalThis.openai;
  delete globalThis.__codexVisualizationInitialGlobals;
  if (initialGlobals?.statePersistence != null) {
    globalThis.openai ??= {};
    globalThis.openai.statePersistence = initialGlobals.statePersistence;
    globalThis.openai.stateModelContext = initialGlobals.stateModelContext ?? &quot;none&quot;;
  }
  if (!true) {
    return;
  }
  let appliedProperties = [];
  const applyHostStyleVariables = (styleVariables) =&gt; {
    if (styleVariables == null || typeof styleVariables !== &quot;object&quot;) {
      return;
    }
    for (const property of appliedProperties) {
      styleForProperty(property).removeProperty(property);
    }
    appliedProperties = [];
    for (const [property, value] of Object.entries(styleVariables)) {
      if (property.startsWith(&quot;--&quot;) &amp;&amp; typeof value === &quot;string&quot;) {
        styleForProperty(property).setProperty(property, value);
        appliedProperties.push(property);
      }
    }
  };

  const syncHostStyles = (globals) =&gt; {
    applyHostStyleVariables(globals?.visualizationStyleVariables);
    const sandboxDocument = globalThis.frameElement?.ownerDocument;
    if (sandboxDocument != null &amp;&amp; globals?.visualizationTheme != null) {
      let colorSchemeMeta = sandboxDocument.querySelector(
        &#x27;meta[name=&quot;color-scheme&quot;]&#x27;,
      );
      if (colorSchemeMeta == null) {
        colorSchemeMeta = sandboxDocument.createElement(&quot;meta&quot;);
        colorSchemeMeta.name = &quot;color-scheme&quot;;
        sandboxDocument.head.appendChild(colorSchemeMeta);
      }
      colorSchemeMeta.content = globals.visualizationTheme;
      sandboxDocument.documentElement.style.colorScheme =
        globals.visualizationTheme;
      // Paint the host surface behind transparent saved visualization documents.
      sandboxDocument.documentElement.style.backgroundColor =
        hostStyle.getPropertyValue(&quot;--background&quot;);
    }
  };

  syncHostStyles(initialGlobals);
  globalThis.addEventListener(&quot;openai:set_globals&quot;, (event) =&gt; {
    syncHostStyles(event.detail?.globals);
  });
})();
&lt;/script&gt;

#gi-beta{--bg-page:#F3F4F6;--bg-card:#FFFFFF;--text-primary:#1F2937;--text-secondary:#6B7280;--border-color:#E5E7EB;--brand-primary:#059669;--bg-highlight:#E6F4EA;--ink:var(--text-primary);--muted:var(--text-secondary);--brand:var(--brand-primary);--red:#EF4444;--yellow:#F59E0B;--green:#10B981;color:var(--ink);font:14px/1.5 Inter,Arial,sans-serif;background:var(--bg-page);border:1px solid #fff;border-radius:24px;display:grid;grid-template-columns:92px minmax(0,1fr);min-height:900px;color-scheme:light}
#gi-beta *{box-sizing:border-box}#gi-beta [hidden]{display:none!important}#gi-beta h1,#gi-beta h2,#gi-beta p{margin:0}#gi-beta h1{font-size:27px;letter-spacing:-1px;margin:7px 0}#gi-beta h2{font-size:16px;letter-spacing:-.3px}#gi-beta p{color:var(--muted)}#gi-beta small{font-size:11px;color:var(--muted)}#gi-beta button,#gi-beta input,#gi-beta select{font:inherit;color:var(--ink)}#gi-beta button{min-height:44px;border-radius:10px;border:1px solid #b7b7b7;background:#ffffff99;padding:10px 15px;cursor:pointer;transition:background 160ms,box-shadow 180ms,transform 160ms,border-color 160ms}#gi-beta button:active{transform:scale(.98)}#gi-beta button:disabled{opacity:.5;cursor:not-allowed}#gi-beta button.primary{background:#0466C8;color:#fff;border-color:#0466C8;font-weight:600}#gi-beta :is(button,input,select):focus-visible{outline:3px solid #171717;outline-offset:3px}#gi-beta input,#gi-beta select{min-height:44px;border:1px solid #999;border-radius:9px;background:#ffffffb8;padding:10px;width:100%;transition:box-shadow 180ms,border-color 180ms}#gi-beta input:focus{border-color:#171717;box-shadow:0 0 0 3px #05966918}#gi-beta label{display:grid;gap:6px;font-size:12px;font-weight:600}#gi-beta label small{font-weight:400}#gi-beta .rail{grid-row:1/3;display:flex;flex-direction:column;align-items:center;padding:24px 10px;background:#ffffff55;border-right:1px solid #fff;border-radius:24px 0 0 24px}#gi-beta .logo{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(140deg,#05966955,#05966920);font-weight:700;font-size:24px;letter-spacing:-2px;margin-bottom:30px}#gi-beta nav{display:grid;gap:14px;width:100%}#gi-beta nav button{border:0;background:transparent;font-size:23px;line-height:1.2;padding:12px 0}#gi-beta nav span{display:block;font-size:10px;margin-top:7px}#gi-beta nav button[aria-current=page]{background:linear-gradient(140deg,#0596692a,#ffffffbb)}#gi-beta .rail-foot{writing-mode:vertical-rl;letter-spacing:3px;font-size:10px;margin-top:auto;padding-top:50px;color:var(--muted)}#gi-beta header{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:24px 28px;border-bottom:1px solid #fff;background:#ffffff55;border-radius:0 24px 0 0}#gi-beta header strong{font-size:19px}#gi-beta .pill,#gi-beta .badge{border-radius:30px;background:#ffffffaa;padding:6px 10px;font-size:11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}#gi-beta .pill:before{content:&#x27;&#x27;;width:6px;height:6px;background:var(--brand);border-radius:50%}#gi-beta main{padding:28px;min-width:0}#gi-beta .page-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}#gi-beta .eyebrow{font-size:10px;letter-spacing:2px;font-weight:700}#gi-beta .card{border:1px solid #ffffffe0;background:var(--bg-card);border-radius:16px;box-shadow:0 8px 28px #17171705,inset 0 1px #ffffffbf;backdrop-filter:blur(18px);transition:box-shadow 200ms,transform 200ms,border-color 200ms;min-width:0}#gi-beta .filters{display:flex;align-items:end;gap:16px;padding:14px 18px;margin-bottom:20px;flex-wrap:wrap}#gi-beta .filters label{width:180px}#gi-beta #storage-status{font-size:11px;align-self:center;margin-left:auto;color:var(--muted)}#gi-beta .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}#gi-beta .stat{padding:20px 18px 14px}#gi-beta .stat&gt;span{font-size:12px}#gi-beta .stat&gt;strong{display:block;font-size:25px;letter-spacing:-1px;margin:18px 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}#gi-beta .stat&gt;small{display:block;padding-top:12px;border-top:1px solid #1717170b}#gi-beta .feature{background:var(--bg-highlight)}#gi-beta .grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(320px,1fr);gap:20px}#gi-beta .section-head{display:flex;justify-content:space-between;gap:12px;align-items:start;padding:22px}#gi-beta .section-head p{font-size:11px;margin-top:5px}#gi-beta #chart{padding:0 18px;min-heigh /* Ajustes das 20 leis de UX. Carregado por último para prevalecer sobre os demais estilos. */

/* Regra 2 (Fitts): alvos de toque de pelo menos 44 px também nos controles segmentados. */
#gi-beta :is(.segments,.admin-tabs) button{padding-inline:14px}
#gi-beta .chart-hit{pointer-events:all}

/* Regra 7 (Von Restorff): só uma ação principal por tela. Com o estado vazio na tela,
   a ação principal é a do próprio cartão; o atalho do cabeçalho fica discreto. */
#gi-beta:has(#empty:not([hidden])) #new-entry.primary{background:var(--bg-card);border-color:#DCDCDA;color:var(--text-primary)}

/* Regra 4 (Proximidade): título do lançamento alinhado com os campos (sem recuo duplo). */
#gi-beta #batch-form&gt;.section-head{padding:0}

/* Regra 11 (Gradiente de objetivo): etapas do lançamento em lote. */
#gi-beta .batch-steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:20px 0 8px;padding:0}
#gi-beta .batch-steps li{display:flex;align-items:center;gap:8px;min-height:36px;padding:6px 14px 6px 8px;border:1px solid var(--border-color,var(--divider));border-radius:999px;font-size:12px;color:var(--text-secondary)}
#gi-beta .batch-steps li b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--track,#E6E6E4);color:var(--text-primary);font-size:12px}
#gi-beta .batch-steps li[aria-current=step]{border-color:var(--text-primary);color:var(--text-primary);font-weight:600}
#gi-beta .batch-steps li[aria-current=step] b{background:var(--text-primary);color:var(--bg-card)}
#gi-beta .batch-steps li[data-done=true] b{background:var(--success);color:#071F18;font-size:0}
#gi-beta .batch-steps li[data-done=true] b:after{content:&quot;✓&quot;;font-size:12px;font-weight:700}
#gi-beta .batch-step-label{margin:0 0 4px;font-size:12px}
@media(min-width:760px){#gi-beta .batch-step-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}}

@media(max-width:759px){
 /* Mostra só a etapa atual por extenso; as outras ficam como bolinhas numeradas. */
 #gi-beta .batch-steps li:not([aria-current=step]){font-size:0;gap:0;padding:6px}
 #gi-beta .batch-steps li:not([aria-current=step]) b{font-size:12px}
 #gi-beta .batch-steps li[data-done=true]:not([aria-current=step]) b{font-size:0}
 #gi-beta .batch-steps li[data-done=true]:not([aria-current=step]) b:after{font-size:12px}
 /* Regra 8 (Fitts): a ação principal do lançamento fica ao alcance do polegar, acima da barra de navegação. */
 #gi-beta #batch-form{overflow:visible;overflow:clip}
 #gi-beta #batch-editor&gt;.actions{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom));z-index:5;margin:0 -16px;padding:12px 16px;background:var(--rail,#FAFAF9);border-top:1px solid var(--divider)}
 #gi-beta #batch-editor&gt;.actions .primary{width:100%}
}

/* Ícones Material Symbols (Google, Apache 2.0), embutidos como SVG: contorno no normal, preenchido no item ativo. */
#gi-beta svg.mi{width:24px;height:24px;fill:currentColor;stroke:none;flex:none}
#gi-beta nav svg.mi-fill{display:none}
#gi-beta nav [aria-current=page] svg.mi-out{display:none}
#gi-beta nav [aria-current=page] svg.mi-fill{display:block}
#gi-beta svg.mi-add,#gi-beta svg.mi-check{width:20px;height:20px;vertical-align:-4px}
#gi-beta #new-entry{display:inline-flex;align-items:center;justify-content:center;gap:6px}
#gi-beta #new-entry svg.mi-add{margin:0;vertical-align:baseline}
@media(prefers-reduced-motion:no-preference){
 @keyframes mi-fill-in{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
 @keyframes mi-check-in{from{transform:scale(.4) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
 #gi-beta nav [aria-current=page] svg.mi-fill{animation:mi-fill-in 320ms cubic-bezier(.2,.9,.3,1.2)}
 #gi-beta nav button svg.mi{transition:transform 180ms}
 #gi-beta nav button:hover svg.mi-out{transform:translateY(-2px)}
 #gi-beta svg.mi-add{transition:transform 220ms}
 #gi-beta button:hover svg.mi-add{transform:rotate(90deg)}
 #gi-beta svg.mi-check{animation:mi-check-in 260ms ease-out}
}

html[data-theme=dark] #gi-beta:not(.rail-collapsed) .rail nav button[aria-current=page] svg{stroke:#FFFFFF}
}

/* botão ocultar/mostrar menu */
#gi-beta .rail-toggle{display:none}
@media(min-width:761px) and (min-height:501px){
#gi-beta .rail-toggle{display:flex;align-items:center;gap:12px;margin-top:18px;width:100%;min-height:44px;padding:8px 12px;border:0;border-radius:10px;background:transparent;color:var(--text-support);font-size:13px;font-weight:500;text-align:left;cursor:pointer}
#gi-beta .rail-toggle svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;transition:transform 200ms}
#gi-beta .rail-toggle:hover{background:var(--track);color:var(--text)}
#gi-beta.rail-collapsed .rail-toggle{width:48px;height:48px;padding:0;justify-content:center;align-self:center}
#gi-beta.rail-collapsed .rail-toggle svg{transform:rotate(180deg)}
#gi-beta.rail-collapsed .rail-toggle span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
html[data-theme=dark] #gi-beta .rail-toggle:hover{background:#333333}
}

/* Inter: regras tipográficas (Figma &quot;Inter — 01 a 04&quot;) */
#gi-beta{font-family:Inter,Arial,sans-serif;font-size:14px;line-height:20px;letter-spacing:0;font-weight:400}
/* Título / H3 (página) e H4 (seções): 32/40 e 24/32, peso 600, tracking -0,6 e -0,3 px */
#gi-beta h1{font-size:32px;line-height:40px;font-weight:600;letter-spacing:-.6px;margin:8px 0}
#gi-beta h2{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.3px}
#gi-beta .ranking-highlight h2{font-size:16px;line-height:24px;letter-spacing:0;font-weight:600}
/* Sobretítulo 12/16 · 600 · tracking 1,2 (caixa alta) */
#gi-beta .eyebrow,#gi-beta .history-group{font:600 12px/16px Inter,Arial,sans-serif;letter-spacing:1.2px;text-transform:uppercase}
/* Texto / Corpo 16/24 e Apoio 14/20 */
#gi-beta .page-heading p,#gi-beta .section-head p{font-size:16px;line-height:24px}
#gi-beta .section-head p{font-size:14px;line-height:20px}
/* Legenda 12/16 · 400 */
#gi-beta small,#gi-beta .chart-detail,#gi-beta .chart-legend{font-size:12px;line-height:16px;letter-spacing:0}
#gi-beta :is(#chart,#evo-chart) text,html[data-theme=dark] #gi-beta :is(#chart,#evo-chart) text{font-family:Inter,Arial,sans-serif;font-size:12px;letter-spacing:0}
/* Interface / Rótulo 14/20 · 600 (rótulos e botões); valor 16/24 · 400 */
#gi-beta label{font-size:14px;line-height:20px;font-weight:600;gap:8px}
#gi-beta :is(input,select,textarea){font-size:14px;line-height:20px;font-weight:400}
#gi-beta button{font-size:14px;line-height:20px;font-weight:600;letter-spacing:0}
#gi-beta .rail nav button,#gi-beta .rail-toggle{font-weight:500}
#gi-beta .rail nav button[aria-current=page]{font-weight:600}
/* Interface / Link 16/24 · 500, com sublinhado (não depender só da cor) */
#gi-beta a{font-weight:500;text-decoration:underline;text-underline-offset:3px}
/* telas estreitas: preserve os pesos, reduza o título; corpo segue 16/24 */
@media(max-width:759px){
#gi-beta h1{font-size:24px;line-height:32px;letter-spacing:-.3px}
#gi-beta h2{font-size:20px;line-height:28px}
}

&lt;dialog id=&quot;batch-review-dialog&quot; aria-labelledby=&quot;batch-review-title&quot;&gt;&lt;h2 id=&quot;batch-review-title&quot;&gt;Conferir lançamentos&lt;/h2&gt;&lt;p id=&quot;batch-review-context&quot;&gt;&lt;/p&gt;&lt;p id=&quot;batch-review-summary&quot;&gt;&lt;/p&gt;&lt;div id=&quot;batch-review-totals&quot; class=&quot;batch-totals&quot;&gt;&lt;/div&gt;&lt;p id=&quot;batch-review-note&quot;&gt;&lt;/p&gt;&lt;div class=&quot;batch-table-wrap&quot;&gt;&lt;table class=&quot;batch-review-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Vendedor&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Ação&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Vendas&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Atend.&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Peças&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;batch-review-rows&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p id=&quot;batch-save-error&quot; class=&quot;error&quot; role=&quot;alert&quot;&gt;&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;batch-back&quot;&gt;Voltar e ajustar&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;primary&quot; id=&quot;batch-confirm&quot;&gt;Confirmar e salvar&lt;/button&gt;&lt;/div&gt;&lt;/dialog&gt;&lt;div class=&quot;split&quot;&gt;&lt;form id=&quot;entry-form&quot; class=&quot;card form-card&quot; hidden inert&gt;&lt;h2 id=&quot;entry-title&quot;&gt;Novo lançamento&lt;/h2&gt;&lt;p&gt;Informe os totais do vendedor por dia ou por bloco de 7 dias úteis. Na opção semanal, escolha o início e a data final do acumulado dentro do bloco. Atualize o mesmo registro conforme a semana avança.&lt;/p&gt;&lt;input id=&quot;entry-id&quot; type=&quot;hidden&quot;&gt;&lt;div class=&quot;form-grid&quot;&gt;&lt;label class=&quot;wide&quot;&gt;Tipo de lançamento&lt;select id=&quot;entry-kind&quot;&gt;&lt;option value=&quot;daily&quot;&gt;Diário&lt;/option&gt;&lt;option value=&quot;weekly&quot;&gt;Semanal · 7 dias úteis&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label id=&quot;entry-month-label&quot; hidden&gt;Mês&lt;input id=&quot;entry-month&quot; type=&quot;month&quot;&gt;&lt;/label&gt;&lt;label id=&quot;entry-week-label&quot; hidden&gt;Bloco semanal&lt;select id=&quot;entry-week&quot;&gt;&lt;/select&gt;&lt;/label&gt;&lt;label id=&quot;entry-period-start-label&quot; hidden&gt;Início do acumulado&lt;input id=&quot;entry-period-start&quot; type=&quot;date&quot; min=&quot;2000-01-01&quot; max=&quot;2099-12-31&quot;&gt;&lt;/label&gt;&lt;label id=&quot;entry-period-end-label&quot; hidden&gt;Acumulado até&lt;input id=&quot;entry-period-end&quot; type=&quot;date&quot; min=&quot;2000-01-01&quot; max=&quot;2099-12-31&quot;&gt;&lt;/label&gt;&lt;label id=&quot;entry-date-label&quot;&gt;Data&lt;input id=&quot;entry-date&quot; type=&quot;date&quot; required min=&quot;2000-01-01&quot; max=&quot;2099-12-31&quot;&gt;&lt;/label&gt;&lt;label&gt;Loja&lt;input id=&quot;entry-store&quot; list=&quot;stores-list&quot; required maxlength=&quot;80&quot; placeholder=&quot;Ex.: Loja Centro&quot;&gt;&lt;/label&gt;&lt;label class=&quot;wide&quot;&gt;Vendedor&lt;select id=&quot;entry-seller&quot; required disabled&gt;&lt;option value=&quot;&quot;&gt;Selecione uma loja primeiro&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;wide&quot;&gt;Vendas líquidas (R$)&lt;input id=&quot;entry-sales&quot; inputmode=&quot;decimal&quot; required placeholder=&quot;0,00&quot; aria-describedby=&quot;sales-help&quot;&gt;&lt;small id=&quot;sales-help&quot;&gt;Total já descontado de cancelamentos e devoluções. Ao digitar, os dois últimos números representam os centavos.&lt;/small&gt;&lt;/label&gt;&lt;label&gt;Atendimentos&lt;input id=&quot;entry-orders&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;1000000&quot; step=&quot;1&quot; required&gt;&lt;/label&gt;&lt;label&gt;Peças vendidas&lt;input id=&quot;entry-pieces&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;1000000&quot; step=&quot;1&quot; required&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;entry-preview&quot;&gt;&lt;span&gt;TM previsto &lt;strong id=&quot;entry-tm&quot;&gt;—&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;PA previsto &lt;strong id=&quot;entry-pa&quot;&gt;—&lt;/strong&gt;&lt;/span&gt;&lt;/div&gt;&lt;p id=&quot;entry-error&quot; class=&quot;error&quot; role=&quot;alert&quot;&gt;&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button type=&quot;submit&quot; class=&quot;primary&quot;&gt;Salvar lançamento&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;clear-entry&quot;&gt;Limpar&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;cancel-edit&quot; hidden&gt;Cancelar edição&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;&lt;article class=&quot;card form-card&quot;&gt;&lt;div class=&quot;section-head history-heading&quot;&gt;&lt;h2&gt;Histórico de lançamentos &lt;small id=&quot;history-count&quot;&gt;&lt;/small&gt;&lt;/h2&gt;&lt;label&gt;Buscar&lt;input id=&quot;history-search&quot; type=&quot;search&quot; placeholder=&quot;Nome ou loja&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;p&gt;Use os filtros de mês e loja para consultar.&lt;/p&gt;&lt;div id=&quot;history&quot;&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button id=&quot;previous&quot;&gt;Anterior&lt;/button&gt;&lt;span id=&quot;page-count&quot;&gt;&lt;/span&gt;&lt;button id=&quot;next&quot;&gt;Próxima&lt;/button&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;targets&quot; class=&quot;view&quot; hidden&gt;&lt;div class=&quot;card form-card&quot; style=&quot;margin-bottom:20px&quot;&gt;&lt;h2&gt;Importar e exportar dados de metas&lt;/h2&gt;&lt;p&gt;Arquivo CSV com metas mensais por loja, individuais mensais e diárias de todos os períodos acessíveis. A importação não exclui metas ausentes do arquivo.&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;goal-export&quot;&gt;Exportar dados&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;goal-template&quot;&gt;Baixar modelo&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;goal-import&quot;&gt;Importar dados&lt;/button&gt;&lt;input id=&quot;goal-import-file&quot; type=&quot;file&quot; accept=&quot;.csv,text/csv&quot; hidden&gt;&lt;/div&gt;&lt;details class=&quot;goal-template-help&quot;&gt;&lt;summary&gt;Como preencher o modelo&lt;/summary&gt;&lt;ol&gt;&lt;li&gt;Clique em &lt;strong&gt;Baixar modelo&lt;/strong&gt;. O arquivo já traz suas lojas e vendedores, com a coluna &lt;strong&gt;meta&lt;/strong&gt; em branco.&lt;/li&gt;&lt;li&gt;Preencha a &lt;strong&gt;meta&lt;/strong&gt; de cada linha, por exemplo &lt;code&gt;1234,56&lt;/code&gt;. Linhas com a meta em branco são ignoradas.&lt;/li&gt;&lt;li&gt;Colunas: &lt;strong&gt;tipo&lt;/strong&gt; (&lt;code&gt;loja&lt;/code&gt;, &lt;code&gt;individual&lt;/code&gt; ou &lt;code&gt;diaria&lt;/code&gt;), &lt;strong&gt;mes&lt;/strong&gt; (&lt;code&gt;2026-11&lt;/code&gt;), &lt;strong&gt;data&lt;/strong&gt; (só na &lt;code&gt;diaria&lt;/code&gt;: &lt;code&gt;2026-11-05&lt;/code&gt;), &lt;strong&gt;loja&lt;/strong&gt; e &lt;strong&gt;vendedor&lt;/strong&gt; (iguais ao cadastro).&lt;/li&gt;&lt;li&gt;Para outra meta diária, copie a linha &lt;code&gt;diaria&lt;/code&gt; e troque a data.&lt;/li&gt;&lt;li&gt;Salve como &lt;strong&gt;CSV separado por ponto e vírgula&lt;/strong&gt; e clique em &lt;strong&gt;Importar dados&lt;/strong&gt;. Você confere o resumo antes de confirmar.&lt;/li&gt;&lt;/ol&gt;&lt;/details&gt;&lt;p id=&quot;goal-transfer-error&quot; class=&quot;error&quot; role=&quot;alert&quot;&gt;&lt;/p&gt;&lt;div id=&quot;goal-import-preview&quot; hidden&gt;&lt;p id=&quot;goal-import-summary&quot;&gt;&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;goal-import-confirm&quot; class=&quot;primary&quot;&gt;Confirmar importação&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;goal-import-cancel&quot;&gt;Cancelar&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;segments goal-tabs&quot;&gt;&lt;button data-goal-mode=&quot;store&quot; aria-pressed=&quot;true&quot;&gt;Por loja&lt;/button&gt;&lt;button data-goal-mode=&quot;seller&quot; aria-pressed=&quot;false&quot;&gt;Individuais&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;split&quot;&gt;&lt;form id=&quot;goal-form&quot; class=&quot;card form-card&quot;&gt;&lt;h2&gt;Meta mensal por loja&lt;/h2&gt;&lt;p&gt;Uma meta por loja e mês. Salvar novamente atualiza a meta existente.&lt;/p&gt;&lt;div class=&quot;form-grid&quot;&gt;&lt;label&gt;Mês&lt;input id=&quot;goal-month&quot; type=&quot;month&quot; required min=&quot;2000-01&quot; max=&quot;2099-12&quot;&gt;&lt;/label&gt;&lt;label&gt;Loja&lt;input id=&quot;goal-store&quot; list=&quot;stores-list&quot; maxlength=&quot;80&quot; required placeholder=&quot;Escolha ou digite a loja&quot; autocomplete=&quot;off&quot;&gt;&lt;/label&gt;&lt;label class=&quot;wide&quot;&gt;Meta de vendas (R$)&lt;input id=&quot;goal-value&quot; inputmode=&quot;decimal&quot; required placeholder=&quot;0,00&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;weekly-suggestion&quot;&gt;&lt;small&gt;Distribuição semanal sugerida · apenas informativa&lt;/small&gt;&lt;div class=&quot;suggestion-bar&quot;&gt;&lt;span&gt;25%&lt;/span&gt;&lt;span&gt;33%&lt;/span&gt;&lt;span&gt;24%&lt;/span&gt;&lt;span&gt;18%&lt;/span&gt;&lt;/div&gt;&lt;div id=&quot;weekly-suggestion-values&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;error&quot; id=&quot;goal-error&quot; role=&quot;alert&quot;&gt;&lt;/p&gt;&lt;button class=&quot;primary&quot; type=&quot;submit&quot;&gt;Salvar meta&lt;/button&gt;&lt;/form&gt;&lt;article class=&quot;card form-card&quot;&gt;&lt;h2&gt;Metas das lojas&lt;/h2&gt;&lt;p id=&quot;goals-total&quot;&gt;&lt;/p&gt;&lt;p&gt;Metas do mês selecionado.&lt;/p&gt;&lt;div id=&quot;goals-list&quot;&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;div class=&quot;split individual-goals&quot;&gt;&lt;form id=&quot;seller-goal-form&quot; class=&quot;card form-card&quot;&gt;&lt;h2&gt;Meta individual mensal&lt;/h2&gt;&lt;p&gt;Defina a meta do vendedor. As metas individuais não alteram automaticamente a meta da loja.&lt;/p&gt;&lt;div class=&quot;form-grid&quot;&gt;&lt;label&gt;Mês&lt;input id=&quot;seller-goal-month&quot; type=&quot;month&quot; min=&quot;2000-01&quot; max=&quot;2099-12&quot; required&gt;&lt;/label&gt;&lt;label&gt;Vendedor e loja&lt;select id=&quot;seller-goal-person&quot; required&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;wide&quot;&gt;Meta de vendas (R$)&lt;input id=&quot;seller-goal-value&quot; inputmode=&quot;decimal&quot; placeholder=&quot;0,00&quot; required&gt;&lt;/label&gt;&lt;/div&gt;&lt;p id=&quot;seller-goal-error&quot; class=&quot;error&quot; role=&quot;alert&quot;&gt;&lt;/p&gt;&lt;button type=&quot;submit&quot; class=&quot;primary&quot;&gt;Salvar meta individual&lt;/button&gt;&lt;/form&gt;&lt;article class=&quot;card form-card&quot;&gt;&lt;h2&gt;Metas individuais&lt;/h2&gt;&lt;p&gt;Metas do mês e da loja selecionados nos filtros acima.&lt;/p&gt;&lt;div id=&quot;seller-goal-list&quot;&gt;&lt;/div&gt;&lt;/article&gt;&lt;form id=&quot;seller-daily-goal-form&quot; class=&quot;card form-card&quot;&gt;&lt;h2&gt;Meta individual diária&lt;/h2&gt;&lt;p&gt;Informe a meta de vendas de um vendedor para uma data específica. Ela não altera a meta mensal nem a meta da loja.&lt;/p&gt;&lt;div class=&quot;form-grid&quot;&gt;&lt;label&gt;Data&lt;input id=&quot;seller-daily-goal-date&quot; type=&quot;date&quot; min=&quot;2000-01-01&quot; max=&quot;2099-12-31&quot; required&gt;&lt;/label&gt;&lt;label&gt;Vendedor e loja&lt;select id=&quot;seller-daily-goal-person&quot; required&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;wide&quot;&gt;Meta de vendas no dia (R$)&lt;input id=&quot;seller-daily-goal-value&quot; inputmode=&quot;decimal&quot; placeholder=&quot;0,00&quot; required&gt;&lt;/label&gt;&lt;/div&gt;&lt;p id=&quot;seller-daily-goal-error&quot; class=&quot;error&quot; role=&quot;alert&quot;&gt;&lt;/p&gt;&lt;button type=&quot;submit&quot; class=&quot;primary&quot;&gt;Salvar meta diária&lt;/button&gt;&lt;/form&gt;&lt;article class=&quot;card form-card&quot;&gt;&lt;h2&gt;Metas diárias&lt;/h2&gt;&lt;p&gt;Metas dos dias do mês e da loja selecionados nos filtros acima. Resultados semanais não são distribuídos por dia.&lt;/p&gt;&lt;div id=&quot;seller-daily-goal-list&quot;&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;evolution&quot; class=&quot;view&quot; hidden&gt;
&lt;div class=&quot;evo-controls&quot;&gt;&lt;label hidden&gt;Visão&lt;select id=&quot;evo-mode&quot;&gt;&lt;option value=&quot;team&quot;&gt;Evolução da equipe&lt;/option&gt;&lt;option value=&quot;individual&quot;&gt;Minha evolução&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;p id=&quot;evo-context&quot;&gt;Use os filtros de mês e loja acima.&lt;/p&gt;&lt;button type=&quot;button&quot; id=&quot;evo-export&quot; class=&quot;primary&quot;&gt;Exportar Excel&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;evo-export-status&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;div id=&quot;evo-empty&quot; class=&quot;empty card&quot; hidden&gt;&lt;/div&gt;
&lt;div id=&quot;evo-content&quot;&gt;&lt;div class=&quot;stats&quot; id=&quot;evo-stats&quot;&gt;&lt;/div&gt;&lt;div class=&quot;grid&quot;&gt;&lt;article class=&quot;card&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Evolução das vendas&lt;/h2&gt;&lt;p id=&quot;evo-chart-caption&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;label&gt;Agrupar por&lt;select id=&quot;evo-group&quot;&gt;&lt;option value=&quot;day&quot;&gt;Dia&lt;/option&gt;&lt;option value=&quot;week&quot;&gt;Semana&lt;/option&gt;&lt;option value=&quot;month&quot;&gt;Mês&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div id=&quot;evo-chart&quot;&gt;&lt;/div&gt;&lt;p id=&quot;evo-chart-detail&quot; class=&quot;chart-detail&quot; aria-live=&quot;polite&quot;&gt;Selecione um ponto para consultar o valor.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;card form-card&quot;&gt;&lt;h2 id=&quot;evo-goal-title&quot;&gt;Meta do período&lt;/h2&gt;&lt;p id=&quot;evo-goal-text&quot;&gt;&lt;/p&gt;&lt;small id=&quot;evo-goal-target&quot;&gt;&lt;/small&gt;&lt;div class=&quot;track evo-progress&quot;&gt;&lt;span id=&quot;evo-goal-bar&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div id=&quot;evo-goal-status&quot;&gt;&lt;/div&gt;&lt;p id=&quot;evo-goal-detail&quot;&gt;&lt;/p&gt;&lt;p id=&quot;evo-daily-summary&quot; hidden&gt;&lt;/p&gt;&lt;small id=&quot;evo-updated&quot;&gt;&lt;/small&gt;&lt;/article&gt;&lt;/div&gt;&lt;article class=&quot;card form-card evo-team-card&quot;&gt;&lt;h2 id=&quot;evo-list-title&quot;&gt;Resultados da equipe&lt;/h2&gt;&lt;p id=&quot;evo-comparison-note&quot;&gt;&lt;/p&gt;&lt;div id=&quot;evo-results&quot;&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;ranking&quot; class=&quot;view&quot; hidden&gt;
 &lt;div class=&quot;card form-card ranking-controls&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div class=&quot;segments&quot; role=&quot;group&quot; aria-label=&quot;Participantes do ranking&quot;&gt;&lt;button type=&quot;button&quot; data-ranking-mode=&quot;sellers&quot; aria-pressed=&quot;true&quot;&gt;Vendedores&lt;/button&gt;&lt;button type=&quot;button&quot; data-ranking-mode=&quot;stores&quot; aria-pressed=&quot;false&quot;&gt;Lojas&lt;/button&gt;&lt;/div&gt;&lt;button id=&quot;ranking-export&quot; type=&quot;button&quot;&gt;Exportar Excel&lt;/button&gt;&lt;/div&gt;
 &lt;div class=&quot;ranking-fields&quot;&gt;&lt;label&gt;Período&lt;select id=&quot;ranking-week&quot;&gt;&lt;option value=&quot;&quot;&gt;Mês completo&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;Classificar por&lt;select id=&quot;ranking-criterion&quot;&gt;&lt;option value=&quot;attainment&quot;&gt;Atingimento da meta&lt;/option&gt;&lt;option value=&quot;sales&quot;&gt;Vendas líquidas&lt;/option&gt;&lt;option value=&quot;ticket&quot;&gt;Ticket médio&lt;/option&gt;&lt;option value=&quot;pa&quot;&gt;P.A.&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;p id=&quot;ranking-period&quot;&gt;&lt;/p&gt;&lt;p id=&quot;ranking-scope&quot;&gt;&lt;/p&gt;&lt;p id=&quot;ranking-goal-note&quot;&gt;&lt;/p&gt;&lt;p id=&quot;ranking-updated&quot;&gt;&lt;/p&gt;&lt;p id=&quot;ranking-export-status&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;/div&gt;
 &lt;div id=&quot;ranking-notice&quot; class=&quot;card ranking-notice&quot; role=&quot;status&quot;&gt;&lt;/div&gt;
 &lt;div id=&quot;ranking-podium&quot; class=&quot;ranking-podium&quot; aria-label=&quot;Destaques do ranking&quot;&gt;&lt;/div&gt;
 &lt;article class=&quot;card form-card ranking-list&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Classificação completa&lt;/h2&gt;&lt;p id=&quot;ranking-count&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;ranking-rule&quot;&gt;Empates recebem a mesma posição, considerando duas casas decimais. Após um empate, a próxima posição considera todos os participantes anteriores: 1º, 1º, 3º.&lt;/p&gt;&lt;div class=&quot;ranking-table-wrap&quot;&gt;&lt;table id=&quot;ranking-table&quot;&gt;&lt;caption class=&quot;sr-only&quot;&gt;Classificação e indicadores dos participantes no período selecionado&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Posição&lt;/th&gt;&lt;th scope=&quot;col&quot; id=&quot;ranking-name-head&quot;&gt;Vendedor / Loja&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Vendas líquidas&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Meta do período&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Atingimento&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;TM&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;P.A.&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Atend.&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Peças&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Detalhe&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;ranking-body&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div id=&quot;ranking-totals&quot; class=&quot;batch-totals&quot;&gt;&lt;/div&gt;&lt;/article&gt;
&lt;/section&gt;
&lt;section id=&quot;admin&quot; class=&quot;view&quot; hidden&gt;
&lt;div class=&quot;admin-intro card&quot;&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;ADMINISTRAÇÃO&lt;/span&gt;&lt;h2&gt;Organize sua operação.&lt;/h2&gt;&lt;p&gt;Lojas e vendedores são salvos na nuvem. O banco protege o acesso conforme o perfil; o administrador cadastra contas e define os perfis neste painel.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button data-view=&quot;targets&quot;&gt;Gerenciar metas&lt;/button&gt;&lt;button data-view=&quot;records&quot;&gt;Revisar lançamentos&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;admin-counts&quot; id=&quot;admin-counts&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;admin-tabs&quot; role=&quot;group&quot; aria-label=&quot;Cadastros administrativos&quot;&gt;&lt;button data-admin-tab=&quot;stores&quot; aria-pressed=&quot;true&quot;&gt;Lojas&lt;/button&gt;&lt;button data-admin-tab=&quot;sellers&quot; aria-pressed=&quot;false&quot;&gt;Vendedores&lt;/button&gt;&lt;button data-admin-tab=&quot;users&quot; aria-pressed=&quot;false&quot;&gt;Usuários e perfis&lt;/button&gt;&lt;button data-admin-tab=&quot;backup&quot; aria-pressed=&quot;false&quot;&gt;Backup&lt;/button&gt;&lt;button data-admin-tab=&quot;audit&quot; aria-pressed=&quot;false&quot;&gt;Histórico&lt;/button&gt;&lt;/div&gt;
&lt;p id=&quot;admin-feedback&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;admin-layout&quot;&gt;&lt;form id=&quot;admin-form&quot; class=&quot;card form-card&quot;&gt;&lt;h2 id=&quot;admin-form-title&quot;&gt;Cadastrar loja&lt;/h2&gt;&lt;input id=&quot;admin-id&quot; type=&quot;hidden&quot;&gt;&lt;div class=&quot;form-grid&quot;&gt;&lt;label class=&quot;wide&quot;&gt;Nome&lt;input id=&quot;admin-name&quot; required maxlength=&quot;80&quot; autocomplete=&quot;off&quot;&gt;&lt;/label&gt;&lt;label id=&quot;admin-email-label&quot; class=&quot;wide&quot; hidden&gt;E-mail&lt;input id=&quot;admin-email&quot; type=&quot;email&quot; maxlength=&quot;160&quot; autocomplete=&quot;off&quot;&gt;&lt;/label&gt;&lt;label id=&quot;admin-username-label&quot; class=&quot;wide&quot; hidden&gt;Usuário&lt;input id=&quot;admin-username&quot; minlength=&quot;3&quot; maxlength=&quot;40&quot; pattern=&quot;[A-Za-z0-9][A-Za-z0-9._-]{2,39}&quot; autocomplete=&quot;off&quot;&gt;&lt;small&gt;Letras sem acentos, números, ponto, hífen ou sublinhado.&lt;/small&gt;&lt;/label&gt;&lt;label id=&quot;admin-password-label&quot; class=&quot;wide&quot; hidden&gt;Senha&lt;input id=&quot;admin-password&quot; type=&quot;password&quot; minlength=&quot;8&quot; maxlength=&quot;128&quot; autocomplete=&quot;new-password&quot;&gt;&lt;small&gt;Use pelo menos 8 caracteres. A senha nunca será exibida na lista.&lt;/small&gt;&lt;/label&gt;&lt;label id=&quot;admin-role-label&quot; class=&quot;wide&quot; hidden&gt;Perfil de acesso&lt;select id=&quot;admin-role&quot;&gt;&lt;option value=&quot;admin&quot;&gt;Administrador&lt;/option&gt;&lt;option value=&quot;manager&quot;&gt;Gestor&lt;/option&gt;&lt;option value=&quot;seller&quot;&gt;Vendedor&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label id=&quot;admin-store-label&quot; class=&quot;wide&quot; hidden&gt;Loja&lt;select id=&quot;admin-store&quot;&gt;&lt;/select&gt;&lt;/label&gt;&lt;label id=&quot;admin-seller-label&quot; class=&quot;wide&quot; hidden&gt;Cadastro do vendedor&lt;select id=&quot;admin-seller&quot;&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;p id=&quot;admin-form-help&quot;&gt;&lt;/p&gt;&lt;p id=&quot;admin-error&quot; class=&quot;error&quot; role=&quot;alert&quot;&gt;&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button type=&quot;submit&quot; class=&quot;primary&quot;&gt;Salvar cadastro&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;admin-cancel&quot; hidden&gt;Cancelar edição&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;
&lt;article class=&quot;card form-card&quot;&gt;&lt;div class=&quot;admin-list-head&quot;&gt;&lt;h2 id=&quot;admin-list-title&quot;&gt;Lojas cadastradas&lt;/h2&gt;&lt;label&gt;Buscar&lt;input id=&quot;admin-search&quot; type=&quot;search&quot; placeholder=&quot;Buscar por nome&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;p id=&quot;admin-list-help&quot;&gt;Arquivar preserva os resultados já registrados.&lt;/p&gt;&lt;div id=&quot;admin-list&quot; class=&quot;admin-list&quot;&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;
&lt;article id=&quot;admin-permissions&quot; class=&quot;card form-card&quot; hidden&gt;&lt;h2&gt;Permissões de acesso&lt;/h2&gt;&lt;div class=&quot;admin-permission-grid&quot;&gt;&lt;p&gt;&lt;strong&gt;Administrador&lt;/strong&gt;&lt;br&gt;Gerencia usuários, lojas, metas e todos os resultados.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Gestor&lt;/strong&gt;&lt;br&gt;Registra e corrige os resultados dos vendedores, gerencia metas e acompanha a loja vinculada.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Vendedor&lt;/strong&gt;&lt;br&gt;Acompanha a evolução dos próprios resultados. Acesso somente para consulta, sem registrar, editar ou excluir lançamentos.&lt;/p&gt;&lt;/div&gt;&lt;small&gt;Administrador: e-mail ou usuário e senha. Gestor e vendedor: usuário e senha. O vendedor apenas consulta seus resultados. Nenhum e-mail é enviado por este cadastro.&lt;/small&gt;&lt;/article&gt;

&lt;script&gt;function validateDB(d){
 const fail=()=&gt;{throw Error(&#x27;Arquivo inválido. Use um backup desta beta, versão 1.&#x27;);};
 const obj=v=&gt;v&amp;&amp;typeof v===&#x27;object&#x27;&amp;&amp;!Array.isArray(v);
 const name=v=&gt;typeof v===&#x27;string&#x27;&amp;&amp;v.trim()===v&amp;&amp;v.length&gt;0&amp;&amp;v.length&lt;=80&amp;&amp;!/[\u0000-\u001f]/.test(v);

 const date=v=&gt;typeof v===&#x27;string&#x27;&amp;&amp;/^20\d{2}-\d{2}-\d{2}$/.test(v)&amp;&amp;!isNaN(Date.parse(v))&amp;&amp;new Date(v+&#x27;T12:00:00Z&#x27;).toISOString().slice(0,10)===v;

 for(const e of d.entries){if(!obj(e)||typeof e.id!==&#x27;string&#x27;||!/^[\w-]{1,80}$/.test(e.id)||ids.has(e.id)||!date(e.date)||!name(e.store)||!name(e.seller)||!int(e.cents,100000000000)||!int(e.orders,1000000)||!int(e.pieces,1000000)||(e.orders===0&amp;&amp;(e.cents&gt;0||e.pieces&gt;0)))fail();if(e.updatedAt!==undefined&amp;&amp;(typeof e.updatedAt!==&#x27;string&#x27;||!Number.isFinite(Date.parse(e.updatedAt))))fail();if(e.periodStart!==undefined&amp;&amp;(!date(e.periodStart)||e.periodStart&gt;e.date||e.periodStart.slice(0,7)!==e.date.slice(0,7)))fail();ids.add(e.id);}
 for(const g of d.goals){const key=g.month+&#x27;|&#x27;+g.store;if(!obj(g)||!/^20\d{2}-(0[1-9]|1[0-2])$/.test(g.month)||!name(g.store)||!int(g.cents,100000000000)||g.cents===0||keys.has(key))fail();keys.add(key);}
 return {version:1,admin:validateAdmin(d),entries:d.entries.map(({id,date,store,seller,cents,orders,pieces,updatedAt,periodStart})=&gt;({id,date,store,seller,cents,orders,pieces,...(updatedAt?{updatedAt}:{}),...(periodStart?{periodStart}:{})})),goals:d.goals.map(({month,store,cents})=&gt;({month,store,cents}))};
}
function validateAdmin(d){
 const fail=()=&gt;{throw Error(&#x27;Cadastros administrativos inválidos. Confira os vínculos, nomes e e-mails do backup.&#x27;);};
 const key=s=&gt;s.toLocaleLowerCase(&#x27;pt-BR&#x27;),text=(s,max=80)=&gt;typeof s===&#x27;string&#x27;&amp;&amp;s.trim()===s&amp;&amp;s.length&gt;0&amp;&amp;s.length&lt;=max&amp;&amp;!/[\u0000-\u001f]/.test(s);
 const date=v=&gt;typeof v===&#x27;string&#x27;&amp;&amp;/^20\d{2}-\d{2}-\d{2}$/.test(v)&amp;&amp;!isNaN(Date.parse(v))&amp;&amp;new Date(v+&#x27;T12:00:00Z&#x27;).toISOString().slice(0,10)===v;
 const a=d.admin===undefined?{stores:[],sellers:[],users:[],audit:[]}:d.admin;
 if(!a||typeof a!==&#x27;object&#x27;||![&#x27;stores&#x27;,&#x27;sellers&#x27;,&#x27;users&#x27;,&#x27;audit&#x27;].every(k=&gt;Array.isArray(a[k]))||a.stores.length&gt;5000||a.sellers.length&gt;5000||a.users.length&gt;1000||a.audit.length&gt;200)fail();
 const ids=new Set(),names=new Set(),emails=new Set();
 const base=x=&gt;{if(!x||!text(x.id)||!/^[\w-]+$/.test(x.id)||ids.has(x.id)||!text(x.name)||typeof x.active!==&#x27;boolean&#x27;)fail();ids.add(x.id);return {id:x.id,name:x.name,active:x.active};};
 const stores=a.stores.map(x=&gt;{const v=base(x),k=key(v.name);if(names.has(k))fail();names.add(k);return v;});
 names.clear();
 const sellers=a.sellers.map(x=&gt;{if(x.personId!==undefined&amp;&amp;(!text(x.personId)||!/^[\w-]+$/.test(x.personId)))fail();if(x.updatedAt!==undefined&amp;&amp;(typeof x.updatedAt!==&#x27;string&#x27;||!Number.isFinite(Date.parse(x.updatedAt))))fail();const v={...base(x),storeId:x.storeId,...(x.personId?{personId:x.personId}:{}),...(x.updatedAt?{updatedAt:x.updatedAt}:{})},k=x.storeId+&#x27;|&#x27;+key(v.name);if(!stores.some(s=&gt;s.id===v.storeId)||names.has(k))fail();names.add(k);return v;});
 const users=a.users.map(x=&gt;{const v={...base(x),email:x.email,role:x.role,storeId:x.storeId,sellerId:x.sellerId};if(!text(v.email,160)||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)||emails.has(key(v.email))||![&#x27;admin&#x27;,&#x27;manager&#x27;,&#x27;seller&#x27;].includes(v.role)||typeof v.storeId!==&#x27;string&#x27;||typeof v.sellerId!==&#x27;string&#x27;)fail();if(v.role===&#x27;admin&#x27;&amp;&amp;(v.storeId||v.sellerId))fail();if(v.role!==&#x27;admin&#x27;&amp;&amp;!stores.some(s=&gt;s.id===v.storeId))fail();if(v.role===&#x27;seller&#x27;&amp;&amp;!sellers.some(s=&gt;s.id===v.sellerId&amp;&amp;s.storeId===v.storeId))fail();if(v.role!==&#x27;seller&#x27;&amp;&amp;v.sellerId)fail();emails.add(key(v.email));return v;});
 const audit=a.audit.map(x=&gt;{if(!x||!text(x.id)||!text(x.action,240)||!text(x.actor)||typeof x.at!==&#x27;string&#x27;||!Number.isFinite(Date.parse(x.at)))fail();return {id:x.id,action:x.action,actor:x.actor,at:x.at};});
 let seq=0;const legacyId=()=&gt;{let id;do{id=&#x27;legacy-&#x27;+(++seq);}while(ids.has(id));ids.add(id);return id;};
 // Existing results become registry entries without modifying their amounts or dates.
 for(const row of [...d.goals,...d.entries]){
  let store=stores.find(x=&gt;key(x.name)===key(row.store));if(!store){store={id:legacyId(),name:row.store,active:true};stores.push(store);}
  if(row.seller&amp;&amp;!sellers.some(x=&gt;x.storeId===store.id&amp;&amp;key(x.name)===key(row.seller)))sellers.push({id:legacyId(),name:row.seller,storeId:store.id,active:true});
 }
 if(stores.length&gt;5000||sellers.length&gt;5000)fail();
 const sellerGoals=a.sellerGoals===undefined?[]:a.sellerGoals;if(!Array.isArray(sellerGoals)||sellerGoals.length&gt;5000)fail();const goalKeys=new Set();for(const g of sellerGoals){if(!g||!sellers.some(s=&gt;s.id===g.sellerId)||!/^20\d{2}-(0[1-9]|1[0-2])$/.test(g.month)||!Number.isSafeInteger(g.cents)||g.cents&lt;=0||g.cents&gt;100000000000||goalKeys.has(g.month+&#x27;|&#x27;+g.sellerId))fail();goalKeys.add(g.month+&#x27;|&#x27;+g.sellerId);}const sellerDailyGoals=a.sellerDailyGoals===undefined?[]:a.sellerDailyGoals;if(!Array.isArray(sellerDailyGoals)||sellerDailyGoals.length&gt;10000)fail();const dailyKeys=new Set();for(const g of sellerDailyGoals){if(!g||!sellers.some(s=&gt;s.id===g.sellerId)||!date(g.date)||!Number.isSafeInteger(g.cents)||g.cents&lt;=0||g.cents&gt;100000000000||dailyKeys.has(g.date+&#x27;|&#x27;+g.sellerId))fail();dailyKeys.add(g.date+&#x27;|&#x27;+g.sellerId);}const lifecycle=validateSellerLifecycle(a,stores,sellers,fail);return {stores,sellers,users,audit,...lifecycle,sellerGoals:sellerGoals.map(({sellerId,month,cents})=&gt;({sellerId,month,cents})),sellerDailyGoals:sellerDailyGoals.map(({sellerId,date,cents})=&gt;({sellerId,date,cents}))};
}

function validateSellerLifecycle(a,stores,sellers,fail){
 const out={},date=s=&gt;typeof s===&#x27;string&#x27;&amp;&amp;/^20\d{2}-\d{2}-\d{2}$/.test(s)&amp;&amp;!isNaN(Date.parse(s))&amp;&amp;new Date(s+&#x27;T12:00:00Z&#x27;).toISOString().slice(0,10)===s;
 const id=s=&gt;typeof s===&#x27;string&#x27;&amp;&amp;/^[\w-]{1,80}$/.test(s);
 if(a.sellerPeriods!==undefined){if(!Array.isArray(a.sellerPeriods)||a.sellerPeriods.length&gt;20000)fail();const ids=new Set();out.sellerPeriods=a.sellerPeriods.map(p=&gt;{if(!p||!id(p.id)||ids.has(p.id)||!sellers.some(s=&gt;s.id===p.sellerId&amp;&amp;s.storeId===p.storeId)||(p.startedOn!==null&amp;&amp;!date(p.startedOn))||(p.endedOn!==null&amp;&amp;!date(p.endedOn))||(p.startedOn&amp;&amp;p.endedOn&amp;&amp;p.startedOn&gt;p.endedOn)||![&#x27;transfer&#x27;,&#x27;dismiss&#x27;,&#x27;archive&#x27;,null].includes(p.endReason)||(p.endedOn===null)!==(p.endReason===null))fail();ids.add(p.id);return {id:p.id,sellerId:p.sellerId,storeId:p.storeId,startedOn:p.startedOn,endedOn:p.endedOn,endReason:p.endReason};});}
 if(a.sellerMovements!==undefined){if(!Array.isArray(a.sellerMovements)||a.sellerMovements.length&gt;20000)fail();const ids=new Set();out.sellerMovements=a.sellerMovements.map(m=&gt;{if(!m||!id(m.id)||ids.has(m.id)||!id(m.personId)||!sellers.some(s=&gt;s.id===m.fromSellerId)||(m.toSellerId!==null&amp;&amp;!sellers.some(s=&gt;s.id===m.toSellerId))||![&#x27;transfer&#x27;,&#x27;dismiss&#x27;,&#x27;archive&#x27;,&#x27;reactivate&#x27;].includes(m.action)||!date(m.date)||typeof m.note!==&#x27;string&#x27;||m.note.length&gt;500||typeof m.actor!==&#x27;string&#x27;||m.actor.length&gt;80||!Number.isFinite(Date.parse(m.at))||(m.goalChanges!==null&amp;&amp;(typeof m.goalChanges!==&#x27;object&#x27;||Array.isArray(m.goalChanges))))fail();ids.add(m.id);return {id:m.id,personId:m.personId,fromSellerId:m.fromSellerId,toSellerId:m.toSellerId,action:m.action,date:m.date,note:m.note,actor:m.actor,at:m.at,goalChanges:m.goalChanges};});}
 return out;
}
// Calendar ranges span seven working days (Monday through Saturday).
// Sundays do not advance the counter; recorded sales remain in their date range.
function workingWeekRanges(month){
 const [year,monthNumber]=month.split(&#x27;-&#x27;).map(Number),last=new Date(year,monthNumber,0).getDate(),ranges=[];
 let start=1,workingDays=0;
 for(let day=1;day&lt;=last;day++){
  if(new Date(year,monthNumber-1,day).getDay()!==0)workingDays++;
  if(workingDays===7){ranges.push({start,end:day,workingDays});start=day+1;workingDays=0;}
 }
 if(start&lt;=last){if(workingDays===0&amp;&amp;ranges.length)ranges[ranges.length-1].end=last;else ranges.push({start,end:last,workingDays});}
 return ranges;
}
// Pure calculations shared by the UI and regression checks. Money remains in cents.
function evolutionTotals(rows){return rows.reduce((a,e)=&gt;({sales:a.sales+e.cents,orders:a.orders+e.orders,pieces:a.pieces+e.pieces}),{sales:0,orders:0,pieces:0});}
function evolutionPeriod(month,today){
 const [y,m]=month.split(&#x27;-&#x27;).map(Number),current=today.slice(0,7),last=new Date(y,m,0).getDate();
 const previous=new Date(y,m-2,1),prevMonth=previous.getFullYear()+&#x27;-&#x27;+String(previous.getMonth()+1).padStart(2,&#x27;0&#x27;);
 const cutoff=month===current?Number(today.slice(-2)):last,prevLast=new Date(y,m-1,0).getDate();

}
function evolutionDelta(value,previous){return previous&gt;0?(value-previous)/previous*100:null;}
function evolutionBuckets(rows,month,group,today){

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = globalThis.matchMedia("(max-width:760px), (max-width:1000px) and (max-height:500px)").matches
          ? Math.ceil(globalThis.innerHeight) + "px"
          : Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);

  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const mobile = globalThis.matchMedia("(max-width:760px), (max-width:1000px) and (max-height:500px)").matches;
    const height = Number.parseFloat(frame.style.height);
    if (mobile) {
      frame.style.height = Math.ceil(globalThis.innerHeight) + "px";
    } else if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );

  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
