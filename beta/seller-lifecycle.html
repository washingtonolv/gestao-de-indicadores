<dialog id="seller-move-dialog" aria-labelledby="seller-move-title"><form id="seller-move-form" novalidate><h2 id="seller-move-title">Movimentar vendedor</h2><p id="seller-move-person"></p><input id="seller-move-id" type="hidden"><fieldset id="seller-move-fields"><div class="form-grid"><label class="wide">Ação<select id="seller-move-action"><option value="transfer">Transferir de loja</option><option value="dismiss">Desligar vendedor</option><option value="archive">Arquivar cadastro</option><option value="reactivate">Reativar vendedor</option></select></label><label class="wide"><span id="seller-move-date-label">Data da mudança</span><input id="seller-move-date" type="date" min="2000-01-01" max="2099-12-31" required><small>Informe uma data até hoje. Movimentações futuras ainda não são agendadas.</small></label><label class="wide" id="seller-move-target-label">Nova loja<select id="seller-move-target"></select></label><label class="wide">Observação (opcional)<textarea id="seller-move-note" maxlength="500" rows="3" placeholder="Motivo ou observação sobre a mudança"></textarea></label></div>
<div id="seller-move-goals"><label class="seller-goal-check"><input id="seller-move-adjust" type="checkbox"> Ajustar as metas individuais do mês da transferência</label><p>Desmarcado: as metas atuais são mantidas. Marcado: informe a meta mensal total de cada vínculo. Zero remove a meta daquele vínculo. As metas das lojas e as metas diárias são preservadas.</p><div id="seller-move-goal-fields" class="form-grid" hidden><label>Meta na loja de origem (R$)<input id="seller-move-source-goal" inputmode="decimal" placeholder="0,00"><small id="seller-move-source-before"></small></label><label>Meta na nova loja (R$)<input id="seller-move-target-goal" inputmode="decimal" placeholder="0,00"><small id="seller-move-target-before"></small></label></div></div></fieldset>
<div id="seller-move-review" hidden><h3>Confira antes de confirmar</h3><div id="seller-move-summary"></div></div><p id="seller-move-error" class="error" role="alert"></p><div class="actions"><button type="button" id="seller-move-cancel">Cancelar</button><button type="button" id="seller-move-back" hidden>Voltar e ajustar</button><button type="submit" id="seller-move-next" class="primary">Conferir mudança</button><button type="button" id="seller-move-confirm" class="primary" hidden>Confirmar mudança</button></div></form></dialog>
<dialog id="seller-history-dialog" aria-labelledby="seller-history-title"><h2 id="seller-history-title">Histórico do vendedor</h2><p id="seller-history-name"></p><div id="seller-history-content"></div><div class="actions"><button type="button" id="seller-history-close">Fechar</button></div></dialog>
