<div class="split individual-goals"><form id="seller-goal-form" class="card form-card"><h2>Meta individual mensal</h2><p>Defina a meta do vendedor. As metas individuais não alteram automaticamente a meta da loja.</p><div class="form-grid"><label>Mês<input id="seller-goal-month" type="month" min="2000-01" max="2099-12" required></label><label>Vendedor e loja<select id="seller-goal-person" required></select></label><label class="wide">Meta de vendas (R$)<input id="seller-goal-value" inputmode="decimal" placeholder="0,00" required></label></div><p id="seller-goal-error" class="error" role="alert"></p><button type="submit" class="primary">Salvar meta individual</button></form><article class="card form-card"><h2>Metas individuais</h2><p>Metas do mês e da loja selecionados nos filtros acima.</p><div id="seller-goal-list"></div></article></div>
