  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled=&quot;true&quot;]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

/* Shared preview chrome; product styles stay inside each variant. */
.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(&gt; .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel &gt; [data-variant][hidden] {
  display: none !important;
}

.viz-carousel &gt; [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {
  --viz-carousel-hover: light-dark(
    color-mix(in srgb, var(--foreground) 5.4%, transparent),
    color-mix(in srgb, var(--foreground) 7.8%, transparent)
  );
  position: absolute;
  z-index: 2;
  bottom: 8px;
  left: 50%;
  display: flex;
  width: max-content;
  /* Leave room for the host&#x27;s design-controls launcher at the trailing edge. */
  max-width: calc(100% - 96px);
  align-items: center;
  gap: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  /* Match the settings dropdown chrome independently of the content font size. */
  font-size: 13px;
  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;
}

/* Keep authored mockup button styles out of the shared carousel chrome. */
.viz-carousel-controls button,
.viz-carousel-picker &gt; summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;
  border-radius: 14px !important;
  color: inherit !important;
  background: transparent !important;
  font: inherit !important;
  -webkit-tap-highlight-color: transparent;
}

.viz-carousel-controls &gt; button,
.viz-carousel-picker &gt; summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls &gt; button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker &gt; summary {
  padding-inline: 12px !important;
}

.viz-carousel-controls .viz-carousel-caret {
  width: 14px;
  height: 14px;
  flex: none;
  margin: 0;
  color: inherit;
  transform: rotate(180deg);
}

.viz-carousel-controls &gt; button &gt; svg,
.viz-carousel-controls .viz-carousel-caret,
.viz-carousel-count {
  opacity: 0.5;
}

.viz-carousel-controls &gt; button::before,
.viz-carousel-picker &gt; summary::before {
  position: absolute;
  z-index: -1;
  inset: 3px;
  border-radius: 12px;
  content: &quot;&quot;;
  pointer-events: none;
}

.viz-carousel-controls &gt; button:hover::before,
.viz-carousel-picker &gt; summary:hover::before {
  background: var(--viz-carousel-hover);
}

.viz-carousel-controls &gt; button,
.viz-carousel-controls [data-lucide],
.viz-carousel-controls .lucide {
  flex-shrink: 0;
}

.viz-carousel-picker {
  min-width: 0;
}

.viz-carousel-picker &gt; summary {
  min-width: 0;
  list-style: none;
}

.viz-carousel-picker &gt; summary::-webkit-details-marker {
  display: none;
}

.viz-carousel-count {
  flex-shrink: 0;
  white-space: nowrap;
}

.viz-carousel-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.viz-carousel-options {
  position: absolute;
  right: 0;
  bottom: calc(100% + 4px);
  left: 0;
  display: flex;
  max-height: 240px;
  flex-direction: column;
  gap: 2px;
  overflow: auto;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background);
  box-shadow: 0 4px 12px light-dark(rgb(0 0 0 / 6%), rgb(0 0 0 / 25%));
}

.viz-carousel-options &gt; button {
  border-radius: max(0px, calc(var(--radius-lg) - 5px)) !important;
  width: 100% !important;
  min-height: 28px;
  justify-content: flex-start !important;
  padding: 4px 8px !important;
  font-size: var(--font-size-small) !important;
  text-align: start;
  white-space: normal;
  overflow-wrap: anywhere;
}

.viz-carousel-options &gt; [aria-current=&quot;true&quot;],
.viz-carousel-options &gt; button:hover {
  background: var(--viz-carousel-hover) !important;
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled=&quot;true&quot;] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.viz-carousel-controls :is(button, summary):focus-visible {
  outline: 2px solid var(--ring) !important;
  outline-offset: 2px !important;
}

@media (pointer: coarse) {
  .viz-carousel:has(&gt; .viz-carousel-controls) {
    min-height: calc(76px + var(--viz-carousel-picker-height, 0px));
    padding-bottom: 76px;
  }

  .btn,
  .nav-link,
  .viz-carousel-controls button,
  .viz-carousel-picker &gt; summary,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;

&lt;script&gt;function validateDB(d){
 const fail=()=&gt;{throw Error(&#x27;Arquivo inválido. Use um backup desta beta, versão 1.&#x27;);};
 const obj=v=&gt;v&amp;&amp;typeof v===&#x27;object&#x27;&amp;&amp;!Array.isArray(v);
 const name=v=&gt;typeof v===&#x27;string&#x27;&amp;&amp;v.trim()===v&amp;&amp;v.length&gt;0&amp;&amp;v.length&lt;=80&amp;&amp;!/[\u0000-\u001f]/.test(v);
 const int=(v,max)=&gt;Number.isSafeInteger(v)&amp;&amp;v&gt;=0&amp;&amp;v&lt;=max;
 const date=v=&gt;typeof v===&#x27;string&#x27;&amp;&amp;/^20\d{2}-\d{2}-\d{2}$/.test(v)&amp;&amp;!isNaN(Date.parse(v))&amp;&amp;new Date(v+&#x27;T12:00:00Z&#x27;).toISOString().slice(0,10)===v;
 if(!obj(d)||d.version!==1||!Array.isArray(d.entries)||!Array.isArray(d.goals)||d.entries.length&gt;5000||d.goals.length&gt;1000)fail();
 const ids=new Set(),keys=new Set();
 for(const e of d.entries){if(!obj(e)||typeof e.id!==&#x27;string&#x27;||!/^[\w-]{1,80}$/.test(e.id)||ids.has(e.id)||!date(e.date)||!name(e.store)||!name(e.seller)||!int(e.cents,100000000000)||!int(e.orders,1000000)||!int(e.pieces,1000000)||(e.orders===0&amp;&amp;(e.cents&gt;0||e.pieces&gt;0)))fail();ids.add(e.id);}
 for(const g of d.goals){const key=g.month+&#x27;|&#x27;+g.store;if(!obj(g)||!/^20\d{2}-(0[1-9]|1[0-2])$/.test(g.month)||!name(g.store)||!int(g.cents,100000000000)||g.cents===0||keys.has(key))fail();keys.add(key);}
 return {version:1,admin:validateAdmin(d),entries:d.entries.map(({id,date,store,seller,cents,orders,pieces})=&gt;({id,date,store,seller,cents,orders,pieces})),goals:d.goals.map(({month,store,cents})=&gt;({month,store,cents}))};
}
function validateAdmin(d){
 const fail=()=&gt;{throw Error(&#x27;Cadastros administrativos inválidos. Confira os vínculos, nomes e e-mails do backup.&#x27;);};
 const key=s=&gt;s.toLocaleLowerCase(&#x27;pt-BR&#x27;),text=(s,max=80)=&gt;typeof s===&#x27;string&#x27;&amp;&amp;s.trim()===s&amp;&amp;s.length&gt;0&amp;&amp;s.length&lt;=max&amp;&amp;!/[\u0000-\u001f]/.test(s);
 const a=d.admin===undefined?{stores:[],sellers:[],users:[],audit:[]}:d.admin;
 if(!a||typeof a!==&#x27;object&#x27;||![&#x27;stores&#x27;,&#x27;sellers&#x27;,&#x27;users&#x27;,&#x27;audit&#x27;].every(k=&gt;Array.isArray(a[k]))||a.stores.length&gt;5000||a.sellers.length&gt;5000||a.users.length&gt;1000||a.audit.length&gt;200)fail();
 const ids=new Set(),names=new Set(),emails=new Set();
 const base=x=&gt;{if(!x||!text(x.id)||!/^[\w-]+$/.test(x.id)||ids.has(x.id)||!text(x.name)||typeof x.active!==&#x27;boolean&#x27;)fail();ids.add(x.id);return {id:x.id,name:x.name,active:x.active};};
 const stores=a.stores.map(x=&gt;{const v=base(x),k=key(v.name);if(names.has(k))fail();names.add(k);return v;});
 names.clear();
 const sellers=a.sellers.map(x=&gt;{const v={...base(x),storeId:x.storeId},k=x.storeId+&#x27;|&#x27;+key(v.name);if(!stores.some(s=&gt;s.id===v.storeId)||names.has(k))fail();names.add(k);return v;});
 const users=a.users.map(x=&gt;{const v={...base(x),email:x.email,role:x.role,storeId:x.storeId,sellerId:x.sellerId};if(!text(v.email,160)||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)||emails.has(key(v.email))||![&#x27;admin&#x27;,&#x27;manager&#x27;,&#x27;seller&#x27;].includes(v.role)||typeof v.storeId!==&#x27;string&#x27;||typeof v.sellerId!==&#x27;string&#x27;)fail();if(v.role===&#x27;admin&#x27;&amp;&amp;(v.storeId||v.sellerId))fail();if(v.role!==&#x27;admin&#x27;&amp;&amp;!stores.some(s=&gt;s.id===v.storeId))fail();if(v.role===&#x27;seller&#x27;&amp;&amp;!sellers.some(s=&gt;s.id===v.sellerId&amp;&amp;s.storeId===v.storeId))fail();if(v.role!==&#x27;seller&#x27;&amp;&amp;v.sellerId)fail();emails.add(key(v.email));return v;});
 const audit=a.audit.map(x=&gt;{if(!x||!text(x.id)||!text(x.action,240)||!text(x.actor)||typeof x.at!==&#x27;string&#x27;||!Number.isFinite(Date.parse(x.at)))fail();return {id:x.id,action:x.action,actor:x.actor,at:x.at};});
 let seq=0;const legacyId=()=&gt;{let id;do{id=&#x27;legacy-&#x27;+(++seq);}while(ids.has(id));ids.add(id);return id;};
 // Existing results become registry entries without modifying their amounts or dates.
 for(const row of [...d.goals,...d.entries]){
  let store=stores.find(x=&gt;key(x.name)===key(row.store));if(!store){store={id:legacyId(),name:row.store,active:true};stores.push(store);}

 const date=v=>typeof v==='string'&&/^20\d{2}-\d{2}-\d{2}$/.test(v)&&!isNaN(Date.parse(v))&&new Date(v+'T12:00:00Z').toISOString().slice(0,10)===v;
 if(!obj(d)||d.version!==1||!Array.isArray(d.entries)||!Array.isArray(d.goals)||d.entries.length>5000||d.goals.length>1000)fail();
 const ids=new Set(),keys=new Set();
 for(const e of d.entries){if(!obj(e)||typeof e.id!=='string'||!/^[\w-]{1,80}$/.test(e.id)||ids.has(e.id)||!date(e.date)||!name(e.store)||!name(e.seller)||!int(e.cents,100000000000)||!int(e.orders,1000000)||!int(e.pieces,1000000)||(e.orders===0&&(e.cents>0||e.pieces>0)))fail();ids.add(e.id);}
 for(const g of d.goals){const key=g.month+'|'+g.store;if(!obj(g)||!/^20\d{2}-(0[1-9]|1[0-2])$/.test(g.month)||!name(g.store)||!int(g.cents,100000000000)||g.cents===0||keys.has(key))fail();keys.add(key);}
 return {version:1,admin:validateAdmin(d),entries:d.entries.map(({id,date,store,seller,cents,orders,pieces})=>({id,date,store,seller,cents,orders,pieces})),goals:d.goals.map(({month,store,cents})=>({month,store,cents}))};
}
function validateAdmin(d){
 const fail=()=>{throw Error('Cadastros administrativos inválidos. Confira os vínculos, nomes e e-mails do backup.');};
 const key=s=>s.toLocaleLowerCase('pt-BR'),text=(s,max=80)=>typeof s==='string'&&s.trim()===s&&s.length>0&&s.length<=max&&!/[\u0000-\u001f]/.test(s);
 const a=d.admin===undefined?{stores:[],sellers:[],users:[],audit:[]}:d.admin;
 if(!a||typeof a!=='object'||!['stores','sellers','users','audit'].every(k=>Array.isArray(a[k]))||a.stores.length>5000||a.sellers.length>5000||a.users.length>1000||a.audit.length>200)fail();
 const ids=new Set(),names=new Set(),emails=new Set();
 const base=x=>{if(!x||!text(x.id)||!/^[\w-]+$/.test(x.id)||ids.has(x.id)||!text(x.name)||typeof x.active!=='boolean')fail();ids.add(x.id);return {id:x.id,name:x.name,active:x.active};};
 const stores=a.stores.map(x=>{const v=base(x),k=key(v.name);if(names.has(k))fail();names.add(k);return v;});
 names.clear();
 const sellers=a.sellers.map(x=>{const v={...base(x),storeId:x.storeId},k=x.storeId+'|'+key(v.name);if(!stores.some(s=>s.id===v.storeId)||names.has(k))fail();names.add(k);return v;});
 const users=a.users.map(x=>{const v={...base(x),email:x.email,role:x.role,storeId:x.storeId,sellerId:x.sellerId};if(!text(v.email,160)||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)||emails.has(key(v.email))||!['admin','manager','seller'].includes(v.role)||typeof v.storeId!=='string'||typeof v.sellerId!=='string')fail();if(v.role==='admin'&&(v.storeId||v.sellerId))fail();if(v.role!=='admin'&&!stores.some(s=>s.id===v.storeId))fail();if(v.role==='seller'&&!sellers.some(s=>s.id===v.sellerId&&s.storeId===v.storeId))fail();if(v.role!=='seller'&&v.sellerId)fail();emails.add(key(v.email));return v;});
 const audit=a.audit.map(x=>{if(!x||!text(x.id)||!text(x.action,240)||!text(x.actor)||typeof x.at!=='string'||!Number.isFinite(Date.parse(x.at)))fail();return {id:x.id,action:x.action,actor:x.actor,at:x.at};});
 let seq=0;const legacyId=()=>{let id;do{id='legacy-'+(++seq);}while(ids.has(id));ids.add(id);return id;};
 // Existing results become registry entries without modifying their amounts or dates.
 for(const row of [...d.goals,...d.entries]){
  let store=stores.find(x=>key(x.name)===key(row.store));if(!store){store={id:legacyId(),name:row.store,active:true};stores.push(store);}
  if(row.seller&&!sellers.some(x=>x.storeId===store.id&&key(x.name)===key(row.seller)))sellers.push({id:legacyId(),name:row.seller,storeId:store.id,active:true});
 }
 if(stores.length>5000||sellers.length>5000)fail();
 return {stores,sellers,users,audit};
}
(()=>{
 const frame=document.getElementById('codex-visualization'),key='gestao-indicadores:beta:v1';
 const empty=()=>({version:1,entries:[],goals:[]});
 function read(){const raw=localStorage.getItem(key);if(!raw)return {revision:0,data:empty()};const s=JSON.parse(raw);if(!Number.isSafeInteger(s.revision)||s.revision<0)throw Error('Dados locais inválidos. Restaure um backup antes de continuar.');return {revision:s.revision,data:validateDB(s.data)};}
 function reply(id,result){frame.contentWindow.postMessage({type:'gi-beta-result',id,...result},'*');}
 window.addEventListener('message',e=>{
  if(e.source!==frame.contentWindow||e.origin!=='null'||e.data?.type!=='gi-beta-request')return;
  const {id,op,payload}=e.data;if(!Number.isSafeInteger(id))return;
  try{
   if(op==='read'){const state=read();const probe=key+':probe';localStorage.setItem(probe,'1');localStorage.removeItem(probe);reply(id,{ok:true,...state});}
   else if(op==='save'){
    const current=read();if(payload?.revision!==current.revision)throw Error('Os dados mudaram em outra aba. Recarregue o painel antes de salvar.');
    const data=validateDB(payload.data),state={revision:current.revision+1,data};const raw=JSON.stringify(state);if(raw.length>2000000)throw Error('Limite local atingido. Baixe um backup.');localStorage.setItem(key,raw);reply(id,{ok:true,...state});
   }else if(op==='export'){
    const current=read();const blob=new Blob([JSON.stringify({...current.data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='gestao-indicadores-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);reply(id,{ok:true});
   }
  }catch(err){reply(id,{ok:false,error:err.name==='QuotaExceededError'?'Não foi possível salvar: armazenamento cheio. Baixe um backup e libere espaço.':err.name==='SecurityError'?'O navegador bloqueou o armazenamento. Abra em uma janela normal e permita dados do site.':err.message});}
 });
 window.addEventListener('storage',e=>{if(e.key===key)frame.contentWindow?.postMessage({type:'gi-beta-changed'},'*');});
})();
</script>
<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = globalThis.matchMedia("(max-width:760px), (max-width:1000px) and (max-height:500px)").matches
          ? Math.ceil(globalThis.innerHeight) + "px"
          : Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const mobile = globalThis.matchMedia("(max-width:760px), (max-width:1000px) and (max-height:500px)").matches;
    const height = Number.parseFloat(frame.style.height);
    if (mobile) {
      frame.style.height = Math.ceil(globalThis.innerHeight) + "px";
    } else if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
